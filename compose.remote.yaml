name: ravencoin-explorer

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RAVEN_RPC_URL: http://ravend:8766
  RAVEN_RPC_USER: ${RAVEN_RPC_USER}
  RAVEN_RPC_PASSWORD: ${RAVEN_RPC_PASSWORD}
  RAVEN_RPC_TIMEOUT_MS: ${RAVEN_RPC_TIMEOUT_MS:-30000}
  EXPLORER_DATA_SOURCE: postgres
  EXPLORER_DEMO_MODE: "false"
  INDEXER_STALE_SECONDS: ${INDEXER_STALE_SECONDS:-600}

services:
  ravend:
    build:
      context: .
      dockerfile: Dockerfile.ravencoin
      args:
        RAVEN_REPOSITORY: ${RAVEN_REPOSITORY:-https://github.com/dominant-strategies/Ravencoin-Public.git}
        RAVEN_COMMIT: ${RAVEN_COMMIT:-1ecb6598e8c14487676264b3e2ed91e4cc44c6cc}
    image: dominant-ravencoin-node:${RAVEN_IMAGE_TAG:-1ecb659}
    restart: unless-stopped
    stop_grace_period: 2m
    volumes:
      - ${RAVEN_DATA_DIR}:/data
      - ./raven.conf:/etc/ravencoin/raven.conf:ro
    ports:
      - "0.0.0.0:${RAVEN_P2P_PORT:-8767}:8767"
    healthcheck:
      test: ["CMD-SHELL", "raven-cli -datadir=/data -conf=/etc/ravencoin/raven.conf getblockchaininfo >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 16G

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    shm_size: 16gb
    command:
      - postgres
      - -c
      - shared_buffers=16GB
      - -c
      - effective_cache_size=128GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=64GB
      - -c
      - min_wal_size=8GB
      - -c
      - wal_compression=lz4
      - -c
      - checkpoint_timeout=30min
      - -c
      - effective_io_concurrency=256
      - -c
      - maintenance_io_concurrency=256
      - -c
      - wal_buffers=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - autovacuum_max_workers=6
      - -c
      - autovacuum_work_mem=1GB
      - -c
      - bgwriter_lru_maxpages=1000
      - -c
      - bgwriter_lru_multiplier=4.0
      - -c
      - bgwriter_delay=100ms
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_temp_files=65536
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    build: .
    image: dominant-ravencoin-explorer:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Exceed the 120s indexer SQL timeout so cooperative shutdown can finish
    # cleanup and release the singleton advisory lock before Docker escalates.
    stop_grace_period: 3m
    command: ["node", "server/indexer.mjs"]
    environment:
      <<: *app-environment
      SERVICE_NAME: ravencoin-indexer
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-100}
      INDEXER_RAW_BATCH_SIZE: ${INDEXER_RAW_BATCH_SIZE:-500}
      INDEXER_AGGREGATION_BATCH_SIZE: ${INDEXER_AGGREGATION_BATCH_SIZE:-${INDEXER_BATCH_SIZE:-100}}
      INDEXER_AGGREGATION_CONCURRENCY: ${INDEXER_AGGREGATION_CONCURRENCY:-4}
      INDEXER_FETCH_CONCURRENCY: ${INDEXER_FETCH_CONCURRENCY:-8}
      INDEXER_RAW_LEAD_BLOCKS: ${INDEXER_RAW_LEAD_BLOCKS:-5000}
      INDEXER_WORK_MEM: ${INDEXER_WORK_MEM:-128MB}
      INDEXER_JSON_CHUNK_BYTES: ${INDEXER_JSON_CHUNK_BYTES:-67108864}
      DATABASE_STATEMENT_TIMEOUT_MS: ${INDEXER_DATABASE_STATEMENT_TIMEOUT_MS:-120000}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-1000}
      INDEXER_ASSET_PAGE_SIZE: ${INDEXER_ASSET_PAGE_SIZE:-5000}
      INDEXER_BOOTSTRAP_ASSETS: ${INDEXER_BOOTSTRAP_ASSETS:-true}
    depends_on:
      ravend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 12G

  explorer:
    image: dominant-ravencoin-explorer:${EXPLORER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVICE_NAME: ravencoin-api
      PORT: 3000
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MONITOR_HEALTH_URL: ${MONITOR_HEALTH_URL:-http://127.0.0.1:3000/api/health}
      MONITOR_DISK_PATH: ${MONITOR_DISK_PATH:-/}
      MONITOR_MIN_DISK_FREE_BYTES: ${MONITOR_MIN_DISK_FREE_BYTES:-107374182400}
      MONITOR_MIN_DISK_FREE_PERCENT: ${MONITOR_MIN_DISK_FREE_PERCENT:-10}
      MONITOR_MAX_TEMP_BYTES_PER_INTERVAL: ${MONITOR_MAX_TEMP_BYTES_PER_INTERVAL:-1073741824}
      MONITOR_STATE_FILE: ${MONITOR_STATE_FILE:-/app/ops-state/monitor.json}
      MONITOR_REQUIRE_DATABASE: ${MONITOR_REQUIRE_DATABASE:-true}
      RECONCILE_BLOCK_SAMPLES: ${RECONCILE_BLOCK_SAMPLES:-8}
      RECONCILE_BALANCE_SAMPLES: ${RECONCILE_BALANCE_SAMPLES:-6}
      RECONCILE_TRANSFER_SAMPLES: ${RECONCILE_TRANSFER_SAMPLES:-16}
      RECONCILE_RPC_BATCH_SIZE: ${RECONCILE_RPC_BATCH_SIZE:-4}
      RECONCILE_RPC_TIMEOUT_MS: ${RECONCILE_RPC_TIMEOUT_MS:-120000}
      RECONCILE_DATABASE_TIMEOUT_MS: ${RECONCILE_DATABASE_TIMEOUT_MS:-120000}
      RECONCILE_REQUIRE_ASSET_SAMPLES: ${RECONCILE_REQUIRE_ASSET_SAMPLES:-true}
      RECONCILE_ASSET_GRACE_BLOCKS: ${RECONCILE_ASSET_GRACE_BLOCKS:-1440}
    depends_on:
      ravend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      indexer:
        condition: service_started
    volumes:
      - explorer-ops-state:/app/ops-state
    ports:
      - "0.0.0.0:${EXPLORER_PORT:-3102}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 1m

volumes:
  explorer-ops-state:
