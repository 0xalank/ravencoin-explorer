user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  limit_conn_zone $binary_remote_addr zone=snapshot_per_ip:10m;
  limit_conn_zone $server_name zone=snapshot_global:10m;

  types {
    application/json json;
    application/zstd zst;
  }

  server {
    listen 8080;
    server_name _;
    root /srv/snapshots;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;

    location = / {
      default_type application/json;
      return 200 '{"service":"ravencoin-txindex-snapshots"}\n';
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    location = /latest.json {
      try_files $uri =404;
      expires -1;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ (^|/)\. {
      deny all;
    }

    location /releases/ {
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime off;
      try_files $uri $uri/ =404;
      limit_conn snapshot_per_ip 2;
      limit_conn snapshot_global 8;
      limit_rate_after 10m;
      limit_rate 25m;
      expires 30d;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Access-Control-Allow-Origin "*" always;
    }
  }
}
